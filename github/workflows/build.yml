class PlayerSeat extends StatelessWidget {
  const PlayerSeat({
    super.key,
    required this.player,
    required this.active,
    required this.dealer,
    required this.reveal,
    required this.winner,
  });
  final Player player;
  final bool active;
  final bool dealer;
  final bool reveal;
  final bool winner;

  @override
  Widget build(BuildContext context) {
    final p = player;
    final border = winner
        ? const Color(0xFF7ED957)
        : (active ? gold : Colors.white24);
    return Opacity(
      opacity: p.folded ? .45 : 1,
      child: Column(
        mainAxisSize: MainAxisSize.min,
        children: [
