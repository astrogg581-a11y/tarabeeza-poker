/// يعرض صورة من assets إن وُجدت، وإلا يعرض الرسم البديل.
class AssetOr extends StatelessWidget {
  const AssetOr(
    this.path, {
    super.key,
    required this.fallback,
    this.fit = BoxFit.contain,
  });
  final String path;
  final Widget fallback;
  final BoxFit fit;

  static final Map<String, Uint8List> _cache = {};

  static bool has(String key) => kLobbyImages.containsKey(key);

  static Uint8List? _bytes(String key) {
    final b64 = kLobbyImages[key];
    if (b64 == null) return null;
    return _cache.putIfAbsent(key, () => base64Decode(b64));
  }

  @override
  Widget build(BuildContext context) {
    final key = path.split('/').last.split('.').first;
    final bytes = _bytes(key);
    if (bytes != null) {
      return Image.memory(bytes,
          fit: fit, gaplessPlayback: true, filterQuality: FilterQuality.medium);
    }
    return Image.asset(
      path,
      fit: fit,
      errorBuilder: (_, __, ___) => fallback,
    );
  }
}

