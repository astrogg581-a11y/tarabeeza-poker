// ======================================================================
//                    محرك اللعبة (أوراق + تقييم + رهانات)
// ======================================================================

const List<String> kSuits = ['♠', '♥', '♦', '♣'];
const List<String> kHandNames = [
  'ورقة عالية',
  'زوج',
  'زوجان',
  'ثلاثية',
  'ستريت',
  'فلاش',
  'فل هاوس',
  'رباعية',
  'ستريت فلاش',
];

class PCard {
  const PCard(this.rank, this.suit);
  final int rank; // 2..14 (14 = A)
  final int suit; // 0..3
  String get rankLabel {
    switch (rank) {
      case 14:
        return 'A';
      case 13:
        return 'K';
      case 12:
        return 'Q';
      case 11:
        return 'J';
      default:
        return '$rank';
    }
  }

  String get suitLabel => kSuits[suit];
  bool get red => suit == 1 || suit == 2;
}

List<PCard> newDeck(Random r) {
  final d = <PCard>[
    for (int s = 0; s < 4; s++)
      for (int k = 2; k <= 14; k++) PCard(k, s),
  ];
  d.shuffle(r);
  return d;
}

/// تقييم 5 أوراق: رقم أكبر = يد أقوى. الفئة = score ~/ 759375
int eval5(List<PCard> c) {
  final ranks = c.map((e) => e.rank).toList()..sort((a, b) => b.compareTo(a));
  final flush = c.every((e) => e.suit == c[0].suit);
  final counts = <int, int>{};
  for (final r in ranks) {
    counts[r] = (counts[r] ?? 0) + 1;
  }
  final groups = counts.entries.toList()
    ..sort((a, b) {
      final x = b.value.compareTo(a.value);
      return x != 0 ? x : b.key.compareTo(a.key);
    });
  final ordered = groups.map((e) => e.key).toList();
  final shape = groups.map((e) => e.value).toList();

  int straightHigh = 0;
  if (counts.length == 5) {
    if (ranks[0] - ranks[4] == 4) {
      straightHigh = ranks[0];
    } else if (ranks[0] == 14 && ranks[1] == 5 && ranks[4] == 2) {
      straightHigh = 5; // A-2-3-4-5
    }
  }

  int cat;
  List<int> tb;
  if (straightHigh > 0 && flush) {
    cat = 8;
    tb = [straightHigh];
  } else if (shape[0] == 4) {
    cat = 7;
    tb = ordered;
  } else if (shape[0] == 3 && shape[1] == 2) {
    cat = 6;
    tb = ordered;
  } else if (flush) {
    cat = 5;
    tb = ranks;
  } else if (straightHigh > 0) {
    cat = 4;
    tb = [straightHigh];
  } else if (shape[0] == 3) {
    cat = 3;
    tb = ordered;
  } else if (shape[0] == 2 && shape[1] == 2) {
    cat = 2;
    tb = ordered;
  } else if (shape[0] == 2) {
    cat = 1;
    tb = ordered;
  } else {
    cat = 0;
    tb = ranks;
  }
  int score = cat;
  for (int i = 0; i < 5; i++) {
    score = score * 15 + (i < tb.length ? tb[i] : 0);
  }
  return score;
}

int catOf(int score) => score ~/ 759375; // 15^5

/// أفضل يد ممكنة.
/// أوماها: ورقتان بالضبط من يدك + ثلاث من الطاولة.
/// هولدم: أفضل 5 من 7.
int bestScore(List<PCard> hole, List<PCard> board, bool omaha) {
  if (board.length < 3) return -1;
  int best = -1;
  if (omaha) {
    for (int a = 0; a < hole.length; a++) {
      for (int b = a + 1; b < hole.length; b++) {
        for (int i = 0; i < board.length; i++) {
          for (int j = i + 1; j < board.length; j++) {
            for (int k = j + 1; k < board.length; k++) {
              final s = eval5([hole[a], hole[b], board[i], board[j], board[k]]);
              if (s > best) best = s;
            }
          }
        }
      }
    }
  } else {
    final c = [...hole, ...board];
    final n = c.length;
    for (int a = 0; a < n; a++) {
      for (int b = a + 1; b < n; b++) {
        for (int d = b + 1; d < n; d++) {
          for (int e = d + 1; e < n; e++) {
            for (int f = e + 1; f < n; f++) {
              final s = eval5([c[a], c[b], c[d], c[e], c[f]]);
              if (s > best) best = s;
            }
          }
        }
      }
    }
  }
  return best;
}

class Player {
  Player(this.name, this.emoji, {this.isHero = false});
  final String name;
  final String emoji;
  final bool isHero;
  int chips = 1000000;
  int bet = 0; // رهان الجولة الحالية
  int totalIn = 0; // مجموع ما دفعه في اليد
  bool folded = false;
  bool allIn = false;
  List<PCard> hole = [];
  String lastAction = '';
}

enum Act { fold, checkCall, raise }

class PlayerMove {
  const PlayerMove(this.act, [this.raiseTo = 0]);
  final Act act;
  final int raiseTo;
}

class GameController extends ChangeNotifier {
  GameController({required this.omaha});

  final bool omaha;
  final Random _rnd = Random();

  final List<Player> players = [
    Player('حسن', '😎', isHero: true),
    Player('منى', '👱‍♀️'),
    Player('عمر', '🧑🏿'),
    Player('سارة', '👩'),
    Player('ليلى', '👩‍🦰'),
    Player('ريم', '👩🏽'),
  ];

  static const int smallBlind = 10000;
  static const int bigBlind = 20000;
  static const int startChips = 1000000; // عملات افتراضية فقط

  List<PCard> board = [];
  List<PCard> _deck = [];
  int pot = 0;
  int currentBet = 0;
  int minRaise = bigBlind;
  int dealer = -1;
  int actor = -1;
  bool handOver = true;
  bool reveal = false;
  String message = '';
  Set<int> winners = {};

  Completer<PlayerMove>? _heroWait;
  bool _gone = false;

  Player get hero => players[0];
  bool get heroTurn => _heroWait != null && !_heroWait!.isCompleted;
  int get heroToCall => max(0, currentBet - hero.bet);
  int get heroMaxTo => hero.chips + hero.bet;
  bool get heroCanRaise => heroMaxTo > currentBet;
  int get minRaiseTo => min(currentBet + minRaise, heroMaxTo);

  @override
  void notifyListeners() {
    if (!_gone) super.notifyListeners();
  }

  @override
  void dispose() {
    _gone = true;
    final c = _heroWait;
    if (c != null && !c.isCompleted) c.complete(const PlayerMove(Act.fold));
    super.dispose();
  }

  Future<void> _delay(int ms) => Future.delayed(Duration(milliseconds: ms));

  int _alive() => players.where((p) => !p.folded).length;

  void _put(Player p, int amount) {
    final a = min(amount, p.chips);
    p.chips -= a;
    p.bet += a;
    p.totalIn += a;
    pot += a;
    if (p.chips == 0) p.allIn = true;
  }

  // ---------------- بدء يد جديدة ----------------
  Future<void> startHand() async {
    if (!handOver) return;
    final n = players.length;
    handOver = false;
    reveal = false;
    message = '';
    winners = {};
    board = [];
    pot = 0;
    for (final p in players) {
      if (p.chips < bigBlind) p.chips = startChips; // إعادة تعبئة افتراضية
      p.bet = 0;
      p.totalIn = 0;
      p.folded = false;
      p.allIn = false;
      p.hole = [];
      p.lastAction = '';
    }
    dealer = (dealer + 1) % n;
    _deck = newDeck(_rnd);
    final holeCount = omaha ? 4 : 2;
    for (final p in players) {
      p.hole = [for (int i = 0; i < holeCount; i++) _deck.removeLast()];
    }
    final sb = (dealer + 1) % n;
    final bb = (dealer + 2) % n;
    _put(players[sb], smallBlind);
    players[sb].lastAction = 'SB';
    _put(players[bb], bigBlind);
    players[bb].lastAction = 'BB';
    currentBet = bigBlind;
    minRaise = bigBlind;
    notifyListeners();
    await _runHand();
  }

  Future<void> _runHand() async {
    final n = players.length;
    for (int s = 0; s < 4; s++) {
      if (s > 0) {
        for (final p in players) {
          p.bet = 0;
          if (!p.folded && !p.allIn) p.lastAction = '';
        }
        currentBet = 0;
        minRaise = bigBlind;
        final k = s == 1 ? 3 : 1;
        for (int i = 0; i < k; i++) {
          board.add(_deck.removeLast());
        }
        notifyListeners();
        await _delay(600);
        if (_gone) return;
      }
      if (_alive() == 1) break;
      final start = s == 0 ? (dealer + 3) % n : (dealer + 1) % n;
      await _bettingRound(start);
      if (_gone) return;
      if (_alive() == 1) break;
    }
    await _finish();
  }

  // ---------------- جولة رهان ----------------
  Future<void> _bettingRound(int start) async {
    final n = players.length;
    final acted = <int>{};
    int raises = 0;
    int i = start;
    while (true) {
      if (_gone || _alive() == 1) return;
      final live = <int>[
        for (int k = 0; k < n; k++)
          if (!players[k].folded && !players[k].allIn) k,
      ];
      final pending = live
          .where((k) => !acted.contains(k) || players[k].bet < currentBet)
          .toList();
      if (pending.isEmpty) return;
      if (live.length == 1 && players[live[0]].bet >= currentBet) return;

      final p = players[i];
      if (p.folded || p.allIn || (acted.contains(i) && p.bet >= currentBet)) {
        i = (i + 1) % n;
        continue;
      }

      actor = i;
      notifyListeners();
      final toCall = currentBet - p.bet;
      PlayerMove m;
      if (p.isHero) {
        m = await _askHero();
      } else {
        await _delay(hero.folded ? 250 : 800 + _rnd.nextInt(500));
        m = _botMove(p, toCall, raises);
      }
      if (_gone) return;

      bool raised = false;
      if (m.act == Act.fold) {
        p.folded = true;
        p.lastAction = 'Fold';
      } else {
        final maxTo = p.chips + p.bet;
        final to = min(max(m.raiseTo, currentBet + minRaise), maxTo);
        if (m.act == Act.raise && to > currentBet) {
          _put(p, to - p.bet);
          final size = p.bet - currentBet;
          if (size >= minRaise) minRaise = size;
          currentBet = p.bet;
          raised = true;
          p.lastAction = p.allIn ? 'All-in' : 'Raise';
        } else {
          _put(p, toCall);
          p.lastAction =
              toCall <= 0 ? 'Check' : (p.allIn ? 'All-in' : 'Call');
        }
      }
      acted.add(i);
      if (raised) {
        raises++;
        acted
          ..clear()
          ..add(i);
      }
      i = (i + 1) % n;
    }
  }

  Future<PlayerMove> _askHero() {
    _heroWait = Completer<PlayerMove>();
    notifyListeners();
    return _heroWait!.future;
  }

  /// يُستدعى من الأزرار
  void heroAct(Act a, [int raiseTo = 0]) {
    final c = _heroWait;
    if (c == null || c.isCompleted) return;
    _heroWait = null;
    c.complete(PlayerMove(a, raiseTo));
    notifyListeners();
  }

  // ---------------- ذكاء البوتات ----------------
  double _strength(Player p) {
    if (board.length < 3) {
      double s = 0.15;
      final cnt = <int, int>{};
      for (final c in p.hole) {
        cnt[c.rank] = (cnt[c.rank] ?? 0) + 1;
      }
      for (final e in cnt.entries) {
        if (e.value >= 2) s += e.key >= 10 ? 0.2 : 0.1;
      }
      s += p.hole.where((c) => c.rank >= 11).length * 0.07;
      final suits = <int, int>{};
      for (final c in p.hole) {
        suits[c.suit] = (suits[c.suit] ?? 0) + 1;
      }
      if (suits.values.any((v) => v >= 2)) s += 0.08;
      return (s + _rnd.nextDouble() * 0.15).clamp(0.0, 1.0).toDouble();
    }
    const t = [0.15, 0.3, 0.5, 0.65, 0.8, 0.85, 0.92, 0.97, 1.0];
    final cat = catOf(bestScore(p.hole, board, omaha));
    return (t[cat] + _rnd.nextDouble() * 0.1).clamp(0.0, 1.0).toDouble();
  }

  PlayerMove _botMove(Player p, int toCall, int raises) {
    final s = _strength(p);
    int raiseSize() => currentBet + minRaise * (1 + _rnd.nextInt(3));
    if (toCall <= 0) {
      if (s > 0.7 && raises < 3 && _rnd.nextDouble() < 0.6) {
        return PlayerMove(Act.raise, raiseSize());
      }
      return const PlayerMove(Act.checkCall);
    }
    final odds = toCall / (pot + toCall);
    final limit = toCall <= bigBlind ? 0.2 : odds + 0.15;
    if (s < limit && _rnd.nextDouble() < 0.85) {
      return const PlayerMove(Act.fold);
    }
    if (s > 0.75 && raises < 3 && _rnd.nextDouble() < 0.5) {
      return PlayerMove(Act.raise, raiseSize());
    }
    return const PlayerMove(Act.checkCall);
  }

  // ---------------- نهاية اليد وتوزيع الجوائز ----------------
  Future<void> _finish() async {
    final n = players.length;
    actor = -1;
    final contenders = <int>[
      for (int k = 0; k < n; k++)
        if (!players[k].folded) k,
    ];
    final showdown = contenders.length > 1;
    while (showdown && board.length < 5) {
      board.add(_deck.removeLast());
    }
    final scores = <int, int>{
      for (final k in contenders)
        k: showdown ? bestScore(players[k].hole, board, omaha) : 0,
    };

    // توزيع الرصيد الرئيسي والجانبي
    final won = List<int>.filled(n, 0);
    final levels = players.map((p) => p.totalIn).where((t) => t > 0).toSet().toList()
      ..sort();
    int prev = 0;
    for (final lvl in levels) {
      int slice = 0;
      for (final p in players) {
        slice += max(0, min(p.totalIn, lvl) - prev);
      }
      prev = lvl;
      var elig = contenders.where((k) => players[k].totalIn >= lvl).toList();
      if (elig.isEmpty) elig = contenders;
      int top = -1;
      for (final k in elig) {
        top = max(top, scores[k] ?? 0);
      }
      final w = elig.where((k) => (scores[k] ?? 0) == top).toList();
      final share = slice ~/ w.length;
      for (final k in w) {
        won[k] += share;
      }
      won[w.first] += slice - share * w.length;
    }
    for (int k = 0; k < n; k++) {
      players[k].chips += won[k];
    }

    // رسالة الفوز
    int topScore = -1;
    for (final k in contenders) {
      topScore = max(topScore, scores[k] ?? 0);
    }
    final main =
        contenders.where((k) => (scores[k] ?? 0) == topScore).toList();
    final names = main.map((k) => players[k].name).join(' و ');
    final amount = main.fold<int>(0, (a, k) => a + won[k]);
    message = showdown
        ? '$names فاز بـ ${_fmt(amount)} • ${kHandNames[catOf(topScore)]}'
        : '$names فاز بـ ${_fmt(amount)} (انسحب الجميع)';
    winners = {
      for (int k = 0; k < n; k++)
        if (won[k] > 0) k,
    };
    pot = 0;
    reveal = showdown;
    handOver = true;
    notifyListeners();
  }
}

