class _Pips extends StatelessWidget {
  const _Pips(this.n, this.size, this.color);
  final int n;
  final double size;
  final Color color;

  static const Map<int, List<Offset>> _p = {
    0: [],
    1: [Offset(.5, .5)],
    2: [Offset(.28, .28), Offset(.72, .72)],
    3: [Offset(.25, .25), Offset(.5, .5), Offset(.75, .75)],
    4: [Offset(.28, .28), Offset(.72, .28), Offset(.28, .72), Offset(.72, .72)],
    5: [
      Offset(.28, .28),
      Offset(.72, .28),
      Offset(.5, .5),
      Offset(.28, .72),
      Offset(.72, .72),
    ],
    6: [
      Offset(.28, .2),
      Offset(.72, .2),
      Offset(.28, .5),
      Offset(.72, .5),
      Offset(.28, .8),
      Offset(.72, .8),
    ],
  };

  @override
  Widget build(BuildContext context) {
    final d = size * .2;
    return SizedBox(
      width: size,
      height: size,
      child: Stack(
        children: [
          for (final o in _p[n] ?? const <Offset>[])
            Positioned(
              left: o.dx * size - d / 2,
              top: o.dy * size - d / 2,
              child: Container(
                width: d,
                height: d,
                decoration: BoxDecoration(color: color, shape: BoxShape.circle),
              ),
            ),
        ],
      ),
    );
  }
}

