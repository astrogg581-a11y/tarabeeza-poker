class PokerTablePage extends StatefulWidget {
  const PokerTablePage({
    super.key,
    this.title = 'تكساس هولدم',
    this.omaha = false,
  });
  final String title;
  final bool omaha;

  @override
  State<PokerTablePage> createState() => _PokerTablePageState();
}

class _PokerTablePageState extends State<PokerTablePage> {
  late final GameController game;

  @override
  void initState() {
    super.initState();
    game = GameController(omaha: widget.omaha);
    unawaited(game.startHand());
  }

  @override
  void dispose() {
    game.dispose();
    super.dispose();
  }

  Future<void> _openRaise() async {
    final minTo = game.minRaiseTo;
    final maxTo = game.heroMaxTo;
    if (minTo >= maxTo) {
      game.heroAct(Act.raise, maxTo); // الكل
      return;
    }
    double v = minTo.toDouble();
    final res = await showModalBottomSheet<int>(
      context: context,
      backgroundColor: panel,
      builder: (ctx) => StatefulBuilder(
        builder: (ctx, setSheet) => Directionality(
          textDirection: TextDirection.ltr,
          child: Padding(
            padding: const EdgeInsets.all(14),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Text('Raise إلى ${_fmt(v.round())}',
                    style: const TextStyle(
                        color: gold, fontSize: 18, fontWeight: FontWeight.bold)),
                Slider(
                  min: minTo.toDouble(),
                  max: maxTo.toDouble(),
                  value: v,
                  activeColor: gold,
                  onChanged: (x) => setSheet(() => v = x),
                ),
                Row(
                  mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                  children: [
                    TextButton(
                        onPressed: () => setSheet(() => v = minTo.toDouble()),
                        child: const Text('الأدنى')),
                    TextButton(
                        onPressed: () => setSheet(() => v =
                            (game.currentBet + game.pot)
                                .clamp(minTo, maxTo)
                                .toDouble()),
                        child: const Text('Pot')),
                    TextButton(
                        onPressed: () => setSheet(() => v = maxTo.toDouble()),
                        child: const Text('الكل')),
                  ],
                ),
                ElevatedButton(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF168C55),
                    foregroundColor: Colors.white,
                  ),
                  onPressed: () => Navigator.pop(ctx, v.round()),
                  child: const Text('تأكيد'),
                ),
              ],
            ),
          ),
        ),
      ),
    );
    if (res != null) game.heroAct(Act.raise, res);
  }

  @override
  Widget build(BuildContext context) {
    return Directionality(
      textDirection: TextDirection.ltr,
      child: Scaffold(
        body: SafeArea(
          child: AnimatedBuilder(
            animation: game,
            builder: (context, _) => Column(
              children: [
                _Header(
                    title: widget.title,
                    onBack: () {
                      if (Navigator.of(context).canPop()) {
                        Navigator.of(context).pop();
                      }
                    }),
                Expanded(
                  child: DecoratedBox(
                    decoration: const BoxDecoration(
                      gradient: RadialGradient(
                        radius: 1.0,
                        colors: [Color(0xFF3A1A55), Color(0xFF120A1E)],
                      ),
                    ),
                    child: _tableArea(game),
                  ),
                ),
                _ActionBar(
                  game: game,
                  onRaise: _openRaise,
                  onNext: () => unawaited(game.startHand()),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }

  Widget _tableArea(GameController g) {
    return LayoutBuilder(builder: (context, c) {
      final w = c.maxWidth;
      final h = c.maxHeight;
      final pl = g.players;
      final portrait = w < h;
      final cardW = min(34.0, w * .12);

      Widget seat(int i) => PlayerSeat(
            player: pl[i],
            active: g.actor == i,
            dealer: g.dealer == i,
            reveal: g.reveal,
            winner: g.handOver && g.winners.contains(i),
          );

      String? heroHand;
      if (!g.hero.folded && g.board.length >= 3) {
        final s = bestScore(g.hero.hole, g.board, g.omaha);
        if (s >= 0) heroHand = kHandNames[catOf(s)];
      }

      return Stack(
        children: [
          Positioned(
            left: w * (portrait ? .1 : .13),
            right: w * (portrait ? .1 : .13),
            top: h * (portrait ? .1 : .17),
            bottom: h * (portrait ? .12 : .13),
            child: Container(
              decoration: BoxDecoration(
                gradient: const RadialGradient(
                  colors: [Color(0xFF1C7A5A), Color(0xFF0B4234)],
                ),
                borderRadius: BorderRadius.circular(portrait ? w : h),
                border: Border.all(color: const Color(0xFF6D5A3A), width: 7),
                boxShadow: const [
                  BoxShadow(color: Colors.black54, blurRadius: 18),
                ],
              ),
              child: Container(
                margin: const EdgeInsets.all(14),
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(portrait ? w : h),
                  border: Border.all(color: Colors.white12, width: 2),
                ),
              ),
            ),
          ),
          Align(
            alignment: const Alignment(0, -0.1),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                _PotChip(amount: g.pot),
                const SizedBox(height: 4),
                SizedBox(
                  height: cardW * 1.4,
                  child: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      for (final card in g.board) ...[
                        PlayingCard(card: card, width: cardW),
                        const SizedBox(width: 3),
                      ],
                    ],
                  ),
                ),
                if (heroHand != null)
                  Container(
                    margin: const EdgeInsets.only(top: 3),
                    padding:
                        const EdgeInsets.symmetric(horizontal: 8, vertical: 1),
                    decoration: BoxDecoration(
                      color: Colors.black54,
                      borderRadius: BorderRadius.circular(8),
                    ),
                    child: Text(heroHand,
                        style: const TextStyle(
                            fontSize: 11, fontWeight: FontWeight.bold)),
                  ),
              ],
            ),
          ),
          Align(
              alignment: portrait
                  ? const Alignment(-1, 0.5)
                  : const Alignment(-0.98, 0.05),
              child: seat(1)),
          Align(
              alignment: portrait
                  ? const Alignment(-1, -0.3)
                  : const Alignment(-0.55, -0.98),
              child: seat(2)),
          Align(alignment: const Alignment(0, -1), child: seat(3)),
          Align(
              alignment: portrait
                  ? const Alignment(1, -0.3)
                  : const Alignment(0.55, -0.98),
              child: seat(4)),
          Align(
              alignment: portrait
                  ? const Alignment(1, 0.5)
                  : const Alignment(0.98, 0.05),
              child: seat(5)),
          Align(
            alignment: const Alignment(0, 1),
            child: _HeroSeat(
              player: pl[0],
              active: g.actor == 0,
              dealer: g.dealer == 0,
              winner: g.handOver && g.winners.contains(0),
            ),
          ),
        ],
      );
    });
  }
}

