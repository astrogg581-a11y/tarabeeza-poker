class _ActionBar extends StatelessWidget {
  const _ActionBar({
    required this.game,
    required this.onRaise,
    required this.onNext,
  });
  final GameController game;
  final VoidCallback onRaise;
  final VoidCallback onNext;

  @override
  Widget build(BuildContext context) {
    Widget btn(String label, Color color, VoidCallback? onTap) => Expanded(
          child: Padding(
            padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 6),
            child: ElevatedButton(
              style: ElevatedButton.styleFrom(
                backgroundColor: color,
                foregroundColor: Colors.white,
                disabledBackgroundColor: Colors.white12,
                disabledForegroundColor: Colors.white38,
                shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(10)),
              ),
              onPressed: onTap,
              child: FittedBox(
                child: Text(label,
                    style: const TextStyle(
                        fontWeight: FontWeight.w900, fontSize: 16)),
              ),
            ),
          ),
        );

    if (game.handOver) {
      return Container(
        height: 52,
        color: panel,
        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
        child: Row(
          children: [
            Expanded(
              child: Text(game.message,
                  textAlign: TextAlign.center,
                  style: const TextStyle(
                      color: gold, fontWeight: FontWeight.bold, fontSize: 15)),
            ),
            ElevatedButton(
              style: ElevatedButton.styleFrom(
                backgroundColor: gold,
                foregroundColor: const Color(0xFF3A1F0A),
                shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(20)),
              ),
              onPressed: onNext,
              child: const Text('يد جديدة ▶',
                  style: TextStyle(fontWeight: FontWeight.w900)),
            ),
          ],
        ),
      );
    }

    final turn = game.heroTurn;
    final toCall = game.heroToCall;
    final callLabel = toCall <= 0
        ? 'Check'
        : 'Call ${_fmt(min(toCall, game.hero.chips))}';
    return Container(
      height: 52,
      color: panel,
      child: Row(
        children: [
          btn('Fold', const Color(0xFF8E1B22),
              turn ? () => game.heroAct(Act.fold) : null),
          btn('$callLabel', const Color(0xFF1F4E9A),
              turn ? () => game.heroAct(Act.checkCall) : null),
          btn('Raise', const Color(0xFF168C55),
              turn && game.heroCanRaise ? onRaise : null),
        ],
      ),
    );
  }
}

String _fmt(int n) {
  String t(double v) {
    var s = v.toStringAsFixed(2);
    s = s.replaceAll(RegExp(r'0+$'), '');
    s = s.replaceAll(RegExp(r'\.$'), '');
    return s;
  }

  if (n >= 1000000) return '${t(n / 1000000)}M';
  if (n >= 1000) return '${t(n / 1000)}K';
  return '$n';
}


