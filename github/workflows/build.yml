/// رسمة كل لعبة (120×90) مرسومة بالكود
class _GameArt extends StatelessWidget {
  const _GameArt(this.kind);
  final String kind;

  Widget _fan(List<List<String>> cards, double size, double step) {
    final n = cards.length;
    return SizedBox(
      width: 120,
      height: 66,
      child: Stack(
        alignment: Alignment.bottomCenter,
        children: [
          for (int i = 0; i < n; i++)
            Transform.translate(
              offset: Offset((i - (n - 1) / 2) * step, 0),
              child: Transform.rotate(
                angle: (i - (n - 1) / 2) * 0.26,
                alignment: Alignment.bottomCenter,
                child: _MiniCard(cards[i][0], cards[i][1], size: size),
              ),
            ),
        ],
      ),
    );
  }

  Widget _chips() {
    return const SizedBox(
      width: 78,
      height: 26,
      child: Stack(
        children: [
          Positioned(left: 0, child: _PokerChip(Color(0xFFD32F2F))),
          Positioned(left: 16, child: _PokerChip(Color(0xFF1F4E9A))),
          Positioned(left: 32, child: _PokerChip(Color(0xFF222222))),
          Positioned(left: 48, child: _PokerChip(Color(0xFF1FA24F))),
        ],
      ),
    );
  }

  Widget _cardsWithChips(List<List<String>> cards, double size, double step) {
    return Stack(
      children: [
        Align(alignment: const Alignment(0, -0.6), child: _fan(cards, size, step)),
        Align(alignment: Alignment.bottomCenter, child: _chips()),
      ],
    );
  }

  @override
  Widget build(BuildContext context) {
    Widget child;
    switch (kind) {
      case 'poker':
        child = _cardsWithChips(
            [['A', '♠'], ['K', '♥'], ['Q', '♠'], ['J', '♦'], ['10', '♠']], 32, 17);
        break;
      case 'omaha':
        child = _cardsWithChips(
            [['A', '♠'], ['A', '♣'], ['K', '♥'], ['K', '♣']], 34, 22);
        break;
      case 'tin':
        child = _cardsWithChips([['A', '♠'], ['Q', '♥'], ['J', '♦']], 36, 26);
        break;
      case 'misc':
        child = _cardsWithChips(
            [['Q', '♠'], ['K', '♥'], ['10', '♦'], ['J', '♣']], 34, 22);
        break;
      case 'dice':
        child = Stack(
          children: [
            Align(
              alignment: const Alignment(-0.45, 0),
              child: Transform.rotate(angle: -0.25, child: const _Die(3, 46)),
            ),
            Align(
              alignment: const Alignment(0.5, 0.1),
              child: Transform.rotate(angle: 0.3, child: const _Die(4, 46)),
            ),
          ],
        );
        break;
      case 'domino':
        child = Stack(
          children: [
            Align(
              alignment: const Alignment(-0.35, 0),
              child: Transform.rotate(angle: -0.6, child: const _DominoTile(6, 5)),
            ),
            Align(
              alignment: const Alignment(0.4, 0.1),
              child: Transform.rotate(angle: 0.7, child: const _DominoTile(3, 4)),
            ),
          ],
        );
        break;
      default:
        child = const SizedBox.shrink();
    }
    return SizedBox(width: 120, height: 90, child: child);
  }
}
